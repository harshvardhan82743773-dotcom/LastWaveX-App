name: Build LastWave X APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -o LastWaveX-Android-Project.zip -d source

          echo "Files extracted:"
          find source -maxdepth 4 -type f | head -200

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/source" \
            -type f -name gradlew -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/source" \
              -type f -name settings.gradle -o \
              -type f -name settings.gradle.kts | head -1 | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper missing. Checking Gradle installation..."
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LastWaveX-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
